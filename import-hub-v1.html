<style>
/* Layout: a shipping-manifest workbench. Sticky header with language + tabs; one panel per tab; cars as manifest cards. */
:root{
  --bg:#eef1f3; --surface:#ffffff; --sunken:#e3e8eb; --line:#cfd7dc; --ink:#13202a; --ink-2:#4a5a66;
  --accent:#587246; --accent-ink:#3d5430; --accent-soft:#e2ead9; --on-accent:#ffffff;
  --warn:#a35a00; --warn-soft:#fbecd6; --bad:#a3271b; --bad-soft:#f8dfdb; --ok:#2e6b3a; --ok-soft:#dcefdf; --info:#245a8a; --info-soft:#dbe8f5;
  --display:"Archivo","Arial Narrow",Arial,sans-serif; --body:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161b; --surface:#172129; --sunken:#1e2a33; --line:#2c3a45; --ink:#e7edf1; --ink-2:#9fb0bc;
  --accent:#8fb173; --accent-ink:#a9c98e; --accent-soft:#25331d; --on-accent:#0f161b;
  --warn:#f0b35c; --warn-soft:#3a2a12; --bad:#f08a7e; --bad-soft:#3d1c18; --ok:#86cf95; --ok-soft:#183322; --info:#8cc0ee; --info-soft:#16293b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161b; --surface:#172129; --sunken:#1e2a33; --line:#2c3a45; --ink:#e7edf1; --ink-2:#9fb0bc;
  --accent:#8fb173; --accent-ink:#a9c98e; --accent-soft:#25331d; --on-accent:#0f161b;
  --warn:#f0b35c; --warn-soft:#3a2a12; --bad:#f08a7e; --bad-soft:#3d1c18; --ok:#86cf95; --ok-soft:#183322; --info:#8cc0ee; --info-soft:#16293b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 8px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{margin:0;font-family:var(--display);font-weight:800;font-size:1.35rem;letter-spacing:-.01em}
.brand span{font-family:var(--mono);font-size:.75rem;color:var(--ink-2)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{all:unset;cursor:pointer;padding:5px 11px;font-size:.78rem;font-weight:600;color:var(--ink-2)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lang button:focus-visible,.tabs button:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
nav.tabs::-webkit-scrollbar{display:none}
.tabs button{all:unset;cursor:pointer;white-space:nowrap;padding:9px 12px 10px;font-weight:600;font-size:.88rem;color:var(--ink-2);border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:20px 48px}
section[role="tabpanel"]{display:grid;gap:18px}
h2{margin:0;font-family:var(--display);font-weight:700;font-size:1.4rem;text-wrap:balance}
h3{margin:0;font-family:var(--display);font-weight:700;font-size:1.05rem}
.lead{margin:0;color:var(--ink-2);max-width:68ch}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;font:600 .85rem var(--body);cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.note{font-size:.85rem;color:var(--ink-2)}
.banner{border-radius:8px;padding:9px 12px;font-size:.88rem;background:var(--info-soft);color:var(--info)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunken);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.info{background:var(--info-soft);color:var(--info)}.chip.acc{background:var(--accent-soft);color:var(--accent-ink)}
.mono{font-family:var(--mono);font-size:.82rem}
.num{font-variant-numeric:tabular-nums}
/* Tracker */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{all:unset;cursor:pointer;font-size:.8rem;font-weight:600;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px}
.car{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;align-content:start;min-width:0}
.car.dropped{opacity:.62}
.car .head{display:flex;justify-content:space-between;gap:8px;align-items:start}
.car .title{font-weight:600;font-size:1rem;line-height:1.3;min-width:0}
.car .sub{font-size:.82rem;color:var(--ink-2)}
.status{font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:6px;white-space:nowrap}
.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding-block:8px}
.figs dt{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.figs dd{margin:2px 0 0;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.delta.down{color:var(--ok)}.delta.up{color:var(--bad)}
.car .notes{font-size:.85rem;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--ink-2)}
/* Forms */
form.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:12px}
label.f{display:grid;gap:4px;font-size:.78rem;font-weight:600;color:var(--ink-2);min-width:0}
label.f.wide{grid-column:1/-1}
input,select,textarea{font:inherit;font-size:.92rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.check{display:flex;gap:8px;align-items:center;font-size:.88rem;font-weight:500;color:var(--ink)}
.check input{width:auto}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;width:min(760px,calc(100vw - 32px));max-height:calc(100dvh - 32px)}
dialog::backdrop{background:rgba(10,16,20,.45)}
.dlg{padding:18px;display:grid;gap:14px}
.vin-out{font-size:.85rem}
/* Costs */
.costs{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.costs{grid-template-columns:minmax(0,1fr)}}
.total{font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
table{border-collapse:collapse;width:100%;font-size:.88rem}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
/* Steps */
ol.steps{list-style:none;margin:0;padding:0;display:grid;gap:0;counter-reset:s}
ol.steps li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
ol.steps li .n{counter-increment:s;font-family:var(--mono);font-size:.8rem;color:var(--ink-2);padding-top:2px}
ol.steps li .n::before{content:counter(s,decimal-leading-zero)}
.phase{font-family:var(--display);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);padding-top:14px}
.step-t{font-weight:600}
.step-d{font-size:.88rem;color:var(--ink-2)}
.step-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.stepbox{display:flex;gap:10px;align-items:flex-start}
.stepbox input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--accent)}
.progress{height:8px;border-radius:999px;background:var(--sunken);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0}
/* Docs / lessons */
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.cols ul{margin:8px 0 0;padding-left:18px;display:grid;gap:4px;font-size:.9rem}
.lesson{border-left:3px solid var(--warn);padding:2px 0 2px 12px}
.lesson.good{border-left-color:var(--ok)}
.lesson p{margin:2px 0 0;font-size:.88rem;color:var(--ink-2)}
.contact{display:grid;gap:4px;min-width:0}
.contact .who{font-weight:600}
.contact .line{font-size:.85rem;overflow-wrap:anywhere}
/* Templates */
.tpl{display:grid;gap:10px}
.tpl pre{margin:0;white-space:pre-wrap;font-family:var(--body);font-size:.88rem;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-wrap:anywhere}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:4px 10px;font-size:.78rem;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink)}
a{color:var(--accent-ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:.88rem;z-index:20}
@media (prefers-reduced-motion:no-preference){.btn,.filters button{transition:background-color .15s,color .15s}}
</style>

</header>

<main class="wrap" id="main"></main>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" hidden></div>
