<title>Import Hub Canada–România</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#dfe6d0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c140a" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..700&family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
<style>
/* Layout: the calculator's shell. Header pill + tab pill + content on the left, sticky context column on the right (≥62rem); one column on phones.
   Design system lifted from calculator-import-canada-romania.html: RAL 6011 Reseda green #587246, frosted glass on a leaf scene, Bodoni Moda + Inter. */
:root{
  --ral:#587246;
  --ink:#16200e; --ink-2:#38412e; --accent-ink:#34502a; --focus:#2d4822; --err:#9c2218;
  --ok:#2f6324; --warn:#7a4f00;
  --glass:rgba(255,255,255,.58); --glass-edge:rgba(255,255,255,.72); --glass-in:rgba(255,255,255,.85); --glass-shadow:rgba(20,36,14,.38);
  --well:rgba(255,255,255,.52); --well-hover:rgba(255,255,255,.7); --well-focus:rgba(255,255,255,.95); --well-line:rgba(38,58,28,.18);
  --tint:rgba(88,114,70,.93); --on-tint:#ffffff; --tint-line:rgba(255,255,255,.4);
  --deep:rgba(22,36,17,.8); --on-deep:#f6f3e6; --on-deep-2:#c3d1b1; --deep-line:rgba(255,255,255,.16); --bar:#a9c98e; --g1:#a9d18a; --g2:#f1ecd9; --g3:#e6c170; --g4:#9cc7d6;
  --switch-off:#6f7866; --switch-on:#587246; --thumb:#ffffff;
  --scene:#e3e9d6; --l1:#d7e1c6; --l2:#bfd0a6; --l3:#9db686; --l4:#7b9765; --l5:#587246; --l6:#3d5632; --vein:rgba(255,255,255,.4); --haze:rgba(255,255,255,.75); --haze2:rgba(255,252,238,.6);
  --veil:rgba(227,233,214,.55); --shade:rgba(12,20,9,.42);
  --serif:"Bodoni Moda","Bodoni 72",Didot,Georgia,"Times New Roman",serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px; --s8:32px;
  --gap:clamp(.625rem,1.8vh,1rem); --edge:clamp(.625rem,2.2vh,1.5rem); --r:clamp(1.125rem,3vh,1.75rem);
  color-scheme:light;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#f1eee0; --ink-2:#bccaa9; --accent-ink:#a7cb88; --focus:#a7cb88; --err:#ff9183;
    --ok:#a7cb88; --warn:#f0c472;
    --glass:rgba(14,24,10,.5); --glass-edge:rgba(255,255,255,.17); --glass-in:rgba(255,255,255,.22); --glass-shadow:rgba(0,0,0,.6);
    --well:rgba(255,255,255,.08); --well-hover:rgba(255,255,255,.13); --well-focus:rgba(255,255,255,.2); --well-line:rgba(255,255,255,.1);
    --tint:rgba(88,114,70,.7); --deep:rgba(6,11,5,.62);
    --switch-off:#5f6957; --switch-on:#6f9457;
    --scene:#0b1309; --l1:#122010; --l2:#182a14; --l3:#21371b; --l4:#2f4a25; --l5:#44663a; --l6:#587246; --vein:rgba(255,255,255,.1); --haze:rgba(180,210,150,.14); --haze2:rgba(255,246,210,.09);
    --veil:rgba(11,19,9,.6); --shade:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#f1eee0; --ink-2:#bccaa9; --accent-ink:#a7cb88; --focus:#a7cb88; --err:#ff9183;
  --ok:#a7cb88; --warn:#f0c472;
  --glass:rgba(14,24,10,.5); --glass-edge:rgba(255,255,255,.17); --glass-in:rgba(255,255,255,.22); --glass-shadow:rgba(0,0,0,.6);
  --well:rgba(255,255,255,.08); --well-hover:rgba(255,255,255,.13); --well-focus:rgba(255,255,255,.2); --well-line:rgba(255,255,255,.1);
  --tint:rgba(88,114,70,.7); --deep:rgba(6,11,5,.62);
  --switch-off:#5f6957; --switch-on:#6f9457;
  --scene:#0b1309; --l1:#122010; --l2:#182a14; --l3:#21371b; --l4:#2f4a25; --l5:#44663a; --l6:#587246; --vein:rgba(255,255,255,.1); --haze:rgba(180,210,150,.14); --haze2:rgba(255,246,210,.09);
  --veil:rgba(11,19,9,.6); --shade:rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{overflow-x:clip;-webkit-text-size-adjust:100%;background:var(--scene)}
body{margin:0;min-height:100dvh;overflow-x:clip;color:var(--ink);background:var(--scene);
  font-family:var(--sans);font-size:.9375rem;line-height:1.45;font-optical-sizing:auto;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--scene)}
body.lock{overflow:hidden}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
.skip{position:absolute;inset-inline-start:-999px;top:var(--s3);z-index:30;padding:var(--s2) var(--s4);border-radius:8px;background:var(--glass-in);color:var(--ink);font-weight:500}
.skip:focus{inset-inline-start:var(--s3)}
a{color:var(--accent-ink);text-underline-offset:3px}

/* Backdrop scene: what the glass blurs */
.scene{position:fixed;inset:0;z-index:0;pointer-events:none}
.scene svg{display:block;width:100%;height:100%}
.scene .bg{fill:var(--scene)}
.scene .l1{fill:var(--l1)}.scene .l2{fill:var(--l2)}.scene .l3{fill:var(--l3)}.scene .l4{fill:var(--l4)}.scene .l5{fill:var(--l5)}.scene .l6{fill:var(--l6)}
.scene .vein{fill:none;stroke:var(--vein);stroke-width:2.5;stroke-linecap:round}
.scene .stem{fill:none;stroke:var(--l6);stroke-width:7;stroke-linecap:round}
.scene .haze{fill:var(--haze)}.scene .haze2{fill:var(--haze2)}

/* Frosted glass */
.glass{position:relative;border-radius:var(--r);border:1px solid var(--glass-edge);
  background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(165%);backdrop-filter:blur(26px) saturate(165%);
  box-shadow:inset 0 1px 0 var(--glass-in),0 24px 56px -26px var(--glass-shadow)}
.glass.tint{background:var(--tint);color:var(--on-tint);border-color:var(--tint-line)}
.glass.deep{background:var(--deep);color:var(--on-deep);border-color:var(--deep-line)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass{background:rgba(238,242,228,.94)}.glass.tint{background:#587246}.glass.deep{background:#16240f}
}
@media (prefers-color-scheme: dark){@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root:not([data-theme="light"]) .glass{background:rgba(20,32,15,.95)}}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root[data-theme="dark"] .glass{background:rgba(20,32,15,.95)}}

/* Shell */
.shell{position:relative;z-index:1;min-height:100dvh;padding:var(--edge);
  padding-left:max(16px,var(--edge),env(safe-area-inset-left,0px));padding-right:max(16px,var(--edge),env(safe-area-inset-right,0px));
  padding-top:max(var(--edge),env(safe-area-inset-top,0px));padding-bottom:max(var(--edge),env(safe-area-inset-bottom,0px));
  display:grid;gap:var(--gap);grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "tabs" "side" "main";align-content:start}
.head{grid-area:head}.tabs{grid-area:tabs}.main{grid-area:main;min-width:0;display:flex;flex-direction:column;gap:var(--gap)}
.side{grid-area:side;min-width:0;display:flex;flex-direction:column;gap:var(--gap);align-self:start}
.side:empty{display:none}
@media (min-width:62rem){
  .shell{grid-template-columns:minmax(0,1fr) clamp(22rem,32vw,30rem);grid-template-rows:auto auto 1fr;grid-template-areas:"head side" "tabs side" "main side"}
  .side{position:sticky;top:max(var(--edge),env(safe-area-inset-top,0px));max-height:calc(100dvh - 2 * var(--edge));overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;border-radius:var(--r)}
  .side:empty{display:flex}
}

/* Header pill */
.head{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);padding:0 var(--s2) 0 var(--s6);min-height:clamp(2.75rem,6.4vh,3.5rem);border-radius:999px}
.mark{margin:0;font-family:var(--serif);font-size:1.375rem;font-weight:600;font-variation-settings:"opsz" 24;letter-spacing:.01em;white-space:nowrap}
.mark span{margin-inline-start:var(--s3);font-family:var(--sans);font-size:.75rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.link{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding-inline:var(--s3);
  border-radius:999px;font-size:.875rem;font-weight:600;color:var(--accent-ink);text-decoration:underline;text-decoration-color:transparent;text-underline-offset:4px;touch-action:manipulation}
.link:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.link:active{scale:.96}
.link[aria-disabled="true"],.link:disabled{opacity:.5;cursor:not-allowed}
@media (hover:hover){.link:hover{text-decoration-color:currentColor}}

/* Segmented pills (language, tabs, filters, FR/EN, tri-state) */
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--well);box-shadow:inset 0 0 0 1px var(--well-line);max-width:100%}
.seg button,.seg label{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;min-height:38px;min-width:44px;padding-inline:var(--s3);border-radius:999px;
  font-size:.8125rem;font-weight:650;color:var(--ink-2);white-space:nowrap;touch-action:manipulation}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg button[aria-pressed="true"],.seg label:has(input:checked){background:var(--tint);color:var(--on-tint);box-shadow:0 1px 3px rgba(20,36,14,.25)}
.seg button:focus-visible,.seg label:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:1px}
.seg.sm button,.seg.sm label{min-height:32px;min-width:40px;font-size:.75rem}
.tabs{display:flex;gap:2px;padding:4px;border-radius:999px;overflow-x:auto;scrollbar-width:none;scroll-padding-inline:8px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{all:unset;box-sizing:border-box;flex:none;cursor:pointer;display:inline-flex;align-items:center;min-height:44px;padding-inline:var(--s4);border-radius:999px;font-size:.875rem;font-weight:600;color:var(--ink-2);white-space:nowrap;touch-action:manipulation}
.tabs button[aria-selected="true"]{background:var(--tint);color:var(--on-tint);box-shadow:0 1px 3px rgba(20,36,14,.25)}
.tabs button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
@media (hover:hover){.tabs button:not([aria-selected="true"]):hover,.seg button:not([aria-pressed="true"]):hover{background:var(--well-hover);color:var(--ink)}}

/* Panels and type */
.pad{padding:clamp(1rem,2.8vh,1.75rem) clamp(1.125rem,2.6vw,2.25rem)}
.intro{display:grid;gap:var(--s3)}
h1{margin:0;font-family:var(--serif);font-weight:600;font-variation-settings:"opsz" 28;font-size:clamp(1.625rem,2.2vw + .75rem,2.5rem);line-height:1.08;letter-spacing:-.01em;text-wrap:balance}
h2,h3{margin:0;text-wrap:balance}
.lead{margin:0;max-width:65ch;color:var(--ink-2);font-weight:500}
.spread{display:flex;gap:var(--s3);flex-wrap:wrap;align-items:center;justify-content:space-between}
.spread>*{min-width:0}
.rowx{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center}
.group{display:grid;gap:var(--s2);align-content:start;min-width:0}
.group h2,.label{margin:0 0 var(--s1);padding-bottom:var(--s2);border-bottom:1px solid var(--ral);font-family:var(--sans);font-size:.6875rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink)}
.deep .label,.tint .label{color:var(--on-deep-2);border-color:var(--deep-line)}
.tint .label{color:var(--on-tint);border-color:var(--tint-line)}
.note{margin:0;font-size:.8125rem;line-height:1.45;font-weight:500;color:var(--ink-2);text-wrap:pretty}
.deep .note{color:var(--on-deep-2)}.tint .note{color:var(--on-tint)}
.mut{color:var(--ink-2)}
.mono{font-family:var(--mono);font-size:.8125rem;letter-spacing:.02em}

/* Form rows, wells and switches (calculator) */
.form{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s4)}
@media (min-width:40rem){.form{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:clamp(1.5rem,3vw,3rem);row-gap:clamp(1rem,3vh,2rem)}}
.form .wide{grid-column:1 / -1}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(6.25rem,8.25rem);gap:var(--s3);align-items:center}
.row.full{grid-template-columns:minmax(0,1fr)}
.row.full .lab{padding-bottom:2px}
.lab{min-width:0;font-size:.875rem;line-height:1.25;font-weight:600}
.lab label,.lab .t{display:block}
.lab small{display:block;margin-top:1px;font-size:.75rem;font-weight:500;color:var(--ink-2)}
.lab a{color:var(--accent-ink);text-underline-offset:2px}
.inp{display:flex;align-items:center;gap:6px;min-height:40px;padding-inline:var(--s3);border-radius:12px;background:var(--well);box-shadow:inset 0 0 0 1px var(--well-line);min-width:0}
@media (hover:hover){.inp:hover{background:var(--well-hover)}}
.inp:focus-within{background:var(--well-focus);outline:2px solid var(--focus);outline-offset:1px}
.inp[data-bad]{outline:2px solid var(--err);outline-offset:1px}
.inp input,.inp select,.inp textarea{all:unset;display:block;box-sizing:border-box;flex:1;min-width:0;padding:8px 0;font-size:1rem;font-weight:650;text-align:end;color:var(--ink);caret-color:var(--accent-ink)}
.inp.txt input,.inp select,.inp textarea{text-align:start;font-weight:550}
.inp select{cursor:pointer;padding-inline-end:4px}
.inp select option{color:#16200e;background:#f4f6ee}
.inp.area{align-items:stretch}
.inp textarea{min-height:5.5rem;padding:10px 0;white-space:pre-wrap;overflow-wrap:anywhere;resize:vertical;font-size:.9375rem;line-height:1.45}
.inp .u{font-size:.6875rem;font-weight:700;letter-spacing:.06em;color:var(--ink-2);white-space:nowrap}
.inp input.mono{font-family:var(--mono);font-size:.9375rem;letter-spacing:.04em}
.err{grid-column:1 / -1;margin:0;font-size:.75rem;font-weight:600;color:var(--err)}
.err[hidden]{display:none}
.row.sw{cursor:pointer;touch-action:manipulation;grid-template-columns:minmax(0,1fr) auto;min-height:40px}
.switch{appearance:none;-webkit-appearance:none;margin:0;justify-self:end;position:relative;flex:none;width:46px;height:28px;border-radius:999px;background:var(--switch-off);cursor:pointer}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:var(--thumb);box-shadow:0 1px 3px rgba(0,0,0,.35)}
.switch:checked{background:var(--switch-on)}
.switch:checked::after{translate:18px 0}
.switch:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.switch:disabled{opacity:.55;cursor:not-allowed}
.sws{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,13rem),1fr));gap:var(--s1) var(--s6)}

/* Buttons */
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding-inline:var(--s4);border-radius:999px;
  font-size:.875rem;font-weight:650;color:var(--ink);background:var(--well);box-shadow:inset 0 0 0 1px var(--well-line);white-space:nowrap;touch-action:manipulation;text-decoration:none}
.btn.primary{background:var(--ral);color:#fff;box-shadow:0 6px 18px -8px rgba(20,36,14,.6)}
.btn.danger{color:var(--err)}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn:active:not(:disabled){scale:.97}
@media (hover:hover){.btn:not(.primary):not(:disabled):hover{background:var(--well-hover)}.btn.primary:not(:disabled):hover{background:var(--focus)}}
.tint .btn,.deep .btn{color:inherit;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.tint .link,.deep .link{color:inherit}

/* Chips */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:650;line-height:1.2;padding:4px 9px;border-radius:999px;background:var(--well);box-shadow:inset 0 0 0 1px var(--well-line);color:var(--ink-2);white-space:nowrap}
.chip.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ok) 30%,transparent)}
.chip.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--warn) 32%,transparent)}
.chip.bad{color:var(--err);background:color-mix(in srgb,var(--err) 12%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--err) 30%,transparent)}
.chip.info{color:var(--accent-ink);background:color-mix(in srgb,var(--ral) 14%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ral) 30%,transparent)}
.chip.acc{color:var(--on-tint);background:var(--tint);box-shadow:none}
.chip.wrap{white-space:normal}
.tint .chip,.deep .chip{color:inherit;background:rgba(255,255,255,.14);box-shadow:none}

/* Banner and empty states */
.banner{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s3) var(--s4);border-radius:16px;font-size:.875rem;font-weight:600}
.banner::before{content:"";flex:none;width:8px;height:8px;margin-top:6px;border-radius:50%;background:var(--ral)}
.banner.warn{color:var(--warn)}.banner.warn::before{background:var(--warn)}
.empty{display:grid;gap:var(--s3);justify-items:start;padding:clamp(1.25rem,4vh,2.5rem) clamp(1.125rem,2.6vw,2.25rem)}
.empty p{margin:0;max-width:52ch;color:var(--ink-2);font-weight:500}
.empty .big{font-family:var(--serif);font-size:1.375rem;font-weight:600;color:var(--ink)}

/* Cars */
.filters{justify-self:start}
.cmpbar{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);flex-wrap:wrap;padding:var(--s2) var(--s2) var(--s2) var(--s6);border-radius:999px}
.cmpbar b{font-weight:700}
.cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,19.5rem),1fr));gap:var(--gap)}
.car{display:grid;gap:var(--s3);align-content:start;padding:var(--s4) clamp(1rem,2vw,1.375rem);min-width:0}
.car.sel{outline:2px solid var(--ral);outline-offset:-1px}
.car.dropped{opacity:.66}
.ct{display:flex;justify-content:space-between;gap:var(--s3);align-items:flex-start}
.ct>div{min-width:0}
.ctt{font-family:var(--serif);font-weight:600;font-variation-settings:"opsz" 20;font-size:1.1875rem;line-height:1.2}
.cs{margin:2px 0 0;font-size:.8125rem;font-weight:500;color:var(--ink-2);overflow-wrap:anywhere}
.st-chip{flex:none}
.cp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s3);align-items:end}
.lbl{display:block;font-size:.6875rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.price{margin:2px 0 0;font-family:var(--serif);font-weight:650;font-variation-settings:"opsz" 11;font-size:2rem;line-height:1;letter-spacing:-.01em;white-space:nowrap}
.price .cur,.money .cur{margin-inline-start:.15em;font-family:var(--sans);font-size:.75rem;font-weight:700;letter-spacing:.06em;color:var(--ink-2)}
.delta{display:inline-block;margin-top:4px;font-size:.75rem;font-weight:700;white-space:nowrap}
.delta.down{color:var(--ok)}.delta.up{color:var(--err)}
.spark{display:block;width:112px;height:40px;overflow:visible;color:var(--ral)}
.spark .area{fill:color-mix(in srgb,var(--ral) 18%,transparent)}
.spark .line{fill:none;stroke:var(--ral);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.spark .grid{stroke:var(--well-line);stroke-width:1;vector-effect:non-scaling-stroke}
.spark .end{fill:var(--ral);stroke:var(--thumb);stroke-width:1.5}

{id:"first",l:{ro:"Primul contact cu un dealer",en:"First contact with a dealer",fr:"Premier contact avec un concessionnaire"},
 fr:"Bonjour,\n\nJe suis intéressé par le [MODÈLE] [ANNÉE] (stock [STOCK], NIV [NIV]). Pourriez-vous m'envoyer le rapport Carfax et me confirmer que le véhicule est toujours disponible ?\n\nJ'achète comme particulier, pour ma famille. Le véhicule sera exporté vers l'Europe par une compagnie de transport que j'engage.\n\nMerci,\n[NOM]",
 en:"Hello,\n\nI'm interested in the [YEAR] [MODEL] (stock [STOCK], VIN [VIN]). Could you send me the Carfax report and confirm the car is still available?\n\nI'm buying as a private individual, for my family. The car will be exported to Europe by a shipping company I hire.\n\nThank you,\n[NAME]"},
{id:"offer",l:{ro:"Ofertă + explicația exportului",en:"Offer + export explanation",fr:"Offre + explication de l'exportation"},
 fr:"Bonjour [PRÉNOM],\n\nNous sommes toujours très intéressés par le [MODÈLE] (stock [STOCK]).\n\nNous ne sommes pas des commerçants : c'est une auto pour notre famille en Roumanie. Vous n'auriez qu'à déposer le véhicule à l'entrepôt de la compagnie de transport que nous avons engagée, Viamar Scilla (GO Transport, 180 Graveline, Saint-Laurent). Elle s'occupe de l'exportation et fournit tous les documents.\n\nSelon Revenu Québec, la TPS et la TVQ ne s'appliquent pas quand le vendeur remet le véhicule à un transporteur qui l'expédie hors du Canada :\nhttps://www.revenuquebec.ca/fr/entreprises/taxes/tpstvh-et-tvq/situations-particulieres-liees-a-la-tpstvh-et-a-la-tvq/exportations-hors-du-canada-ou-expeditions-hors-du-quebec/exportation-ou-expedition-de-biens/\n\nNous payons en entier par virement. Notre budget est de [PRIX] $, véhicule livré chez Viamar.\n\nMerci beaucoup,\n[NOM]",
 en:"Hi [FIRST NAME],\n\nWe're still very interested in the [MODEL] (stock [STOCK]).\n\nWe're not dealers: it's a car for our family in Romania. You would only need to drop the car off at the warehouse of the shipping company we hired, Viamar Scilla (GO Transport, 180 Graveline, Saint-Laurent). They handle the export and provide all the documents.\n\nAccording to Revenu Québec, GST and QST don't apply when the seller hands the car over to a carrier that ships it outside Canada:\nhttps://www.revenuquebec.ca/en/businesses/consumption-taxes/gsthst-and-qst/special-cases-gsthst-and-qst/exports-outside-canada-and-shipping-outside-quebec/exports-and-shipping-of-property/\n\nWe pay in full by bank transfer. Our budget is $[PRICE], with the car delivered to Viamar.\n\nThank you so much,\n[NAME]"},
{id:"private",l:{ro:"Întrebări pentru vânzător privat",en:"Questions for a private seller",fr:"Questions pour un particulier"},
 fr:"Bonjour,\n\nVotre [MODÈLE] m'intéresse. Avant de nous voir, quelques questions :\n\n1. Le véhicule est-il à votre nom, sans location ni prêt ?\n2. Avez-vous les factures d'entretien ?\n3. Accepteriez-vous une inspection dans un garage de mon choix ?\n4. Le véhicule sera exporté : seriez-vous d'accord pour le remettre directement à mon transporteur à Saint-Laurent, puis annuler l'immatriculation à la SAAQ ?\n\nMerci,\n[NOM]",
 en:"Hello,\n\nI'm interested in your [MODEL]. Before we meet, a few questions:\n\n1. Is the car in your name, with no lease or loan?\n2. Do you have the service invoices?\n3. Would you agree to an inspection at a garage of my choice?\n4. The car will be exported: would you hand it over directly to my carrier in Saint-Laurent, then cancel the registration with the SAAQ?\n\nThank you,\n[NAME]"},
{id:"viamar",l:{ro:"Rezervare la Viamar",en:"Booking with Viamar",fr:"Réservation chez Viamar"},

 en:"Hello Bruno,\n\nI'd like to book another shared container from Montreal to Rotterdam for a [YEAR] [MODEL], VIN [VIN] (gas powered).\n\nThe buyer is [BUYER NAME]. The car will be dropped off at GO Transport by [SELLER]. Could you send me the booking forms and the insurance form for a value of [VALUE] CAD?\n\nThank you,\n[NAME]"},

 en:"Hello Martyna,\n\nThe [YEAR] [MODEL], VIN [VIN], is on its way to Rotterdam (booking [BOOKING], container [CONTAINER]). Please find attached: bill of lading, registration, bill of sale, ocean freight invoice, passport and your signed authorisation form.\n\nCould you give me an estimated release date so I can arrange the truck to Romania?\n\nThank you,\n[NAME]"},

function dbReady(){if(dbState==="loading"||dbState==="stale"){dbState="ok";clearTimeout(staleTimer)}}
function rerenderSafe(){if(dlg.open)return;var a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&!/^(checkbox|radio)$/.test(a.type)&&(($("main").contains(a))||$("side").contains(a)))return;render()}
render();
(async function(){var d=null;try{d=window.claude&&window.claude.use?await window.claude.use("db"):null}catch(e){d=null}
 if(!d){dbState="off";render();return}db=d;staleTimer=setTimeout(function(){if(dbState==="loading"){dbState="stale";render()}},10000);
 function onErr(){clearTimeout(staleTimer);dbState="off";db=null;render()}
 db.collection("cars").onSnapshot(function(s){cars=s.docs.map(function(x){return Object.assign({_id:x.id},x.data())});if(!s.metadata.fromCache){carsLoaded=true;dbReady()}else if(s.size)carsLoaded=true;rerenderSafe()},onErr);
 db.collection("contacts").onSnapshot(function(s){contacts=s.docs.map(function(x){return Object.assign({_id:x.id},x.data())});if(!s.metadata.fromCache||s.size)contactsLoaded=true;rerenderSafe()},onErr);

 render()})();
